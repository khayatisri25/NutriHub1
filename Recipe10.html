            cuisineSelect.disabled = true;

            const cuisines = new Set();
            for (const dish in nutritionData) {
                if (category === "all" || nutritionData[dish].category === category) {
                    cuisines.add(nutritionData[dish].cuisine);
                }
            }

            if (cuisines.size > 0) {
                cuisineSelect.disabled = false;
                cuisines.forEach(cuisine => {
                    const option = document.createElement("option");
                    option.value = cuisine;
                    option.textContent = cuisine;
                    cuisineSelect.appendChild(option);
                });
            }

            document.getElementById("food-dish").innerHTML = '<option value="">Select...</option>';
            document.getElementById("food-dish").disabled = true;
            document.getElementById("nutrition-details").style.display = "none";
        }

        function filterDishes() {
            const category = document.getElementById("food-filter").value;
            const cuisine = document.getElementById("cuisine-filter").value;
            const dishSelect = document.getElementById("food-dish");

            dishSelect.innerHTML = '<option value="">Select...</option>'; 
            dishSelect.disabled = true;

            for (const dish in nutritionData) {
                if ((category === "all" || nutritionData[dish].category === category) &&
                    (cuisine === "" || nutritionData[dish].cuisine === cuisine)) {
                    const option = document.createElement("option");
                    option.value = dish;
                    option.textContent = dish.toUpperCase();
                    dishSelect.appendChild(option);
                }
            }

            if (dishSelect.options.length > 1) {
                dishSelect.disabled = false;
            }
            document.getElementById("nutrition-details").style.display = "none";
        }

        function showNutrition() {
            const dish = document.getElementById("food-dish").value;
            const detailsDiv = document.getElementById("nutrition-details");

            if (dish) {
                detailsDiv.style.display = "block";
                document.getElementById("quantity").innerText= `quantity: ${nutritionData[dish].quantity}`;
                document.getElementById("calories").innerText = `Calories: ${nutritionData[dish].calories}`;
                document.getElementById("protein").innerText = `Protein: ${nutritionData[dish].protein}`;
                document.getElementById("carbs").innerText = `Carbs: ${nutritionData[dish].carbs}`;
                document.getElementById("fat").innerText = `Fat: ${nutritionData[dish].fat}`;
                document.getElementById("allergens").innerText = `Allergens: ${nutritionData[dish].allergens}`;

                const ingredientsList = document.getElementById("ingredients");
                ingredientsList.innerHTML = nutritionData[dish].ingredients.map(item => `<li>${item}</li>`).join("");

                const recipeStepsList = document.getElementById("recipe-steps");
                recipeStepsList.innerHTML = nutritionData[dish].recipe.map(step => `<li>${step}</li>`).join("");

                document.getElementById("recipe-image").src = nutritionData[dish].image;
            } else {
                detailsDiv.style.display = "none";
            }
        }
    </script>

</body>
